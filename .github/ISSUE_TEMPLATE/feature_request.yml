name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could unimem solve it? Alternatives you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Harness, workflow, links to related systems or papers
